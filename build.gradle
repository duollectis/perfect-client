plugins {
    id 'fabric-loom' version "${loom_version}"
    //id 'com.gradleup.shadow' version '9.3.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/perfect-client.accesswidener")
}

allprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }
}

repositories {
    maven {
        name = "modrinth"
        url = "https://api.modrinth.com/maven"

        content {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()
}

configurations {
    modImplementation.extendsFrom(modImpl)
    include.extendsFrom(modImpl)

    implementation.extendsFrom(lib)
    include.extendsFrom(lib)

    implementation.extendsFrom(shadow)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modCompileOnly fabricApi.module("fabric-renderer-indigo", project.fabric_api_version)
    modCompileOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }

    shadow 'org.tensorflow:tensorflow-core-platform:1.1.0'

    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

